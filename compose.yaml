services:
  paymatch:
    build: .
    ports:
      - "127.0.0.1:8000:80"
    environment:
      APP_NAME: PayMatch
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?Generate an APP_KEY and put it in .env}
      APP_URL: ${APP_URL:-http://localhost:8000}
      DB_CONNECTION: sqlite
      DB_DATABASE: /data/paymatch.sqlite
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      LOG_CHANNEL: stderr
    volumes:
      - paymatch_data:/data
    restart: unless-stopped

volumes:
  paymatch_data:
